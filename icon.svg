<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cd8a"/>
      <stop offset="0.5" stop-color="#c9a961"/>
      <stop offset="1" stop-color="#7f6630"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2a1c" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#ff2a1c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff2a1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7b66"/>
      <stop offset="0.6" stop-color="#e3261a"/>
      <stop offset="1" stop-color="#9c0f08"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="#0f0e0c"/>
  <!-- Kopf: kantige Maske -->
  <polygon points="22,22 46,42 64,36 82,42 106,22 114,62 102,88 64,118 26,88 14,62" fill="url(#gold)"/>
  <!-- Ohren innen -->
  <polygon points="28,34 44,48 30,60" fill="#0f0e0c" opacity="0.6"/>
  <polygon points="100,34 84,48 98,60" fill="#0f0e0c" opacity="0.6"/>
  <!-- Stirn und Brauen -->
  <polygon points="46,42 64,36 82,42 64,54" fill="#0f0e0c" opacity="0.2"/>
  <polygon points="24,52 60,60 60,64 22,58" fill="#0f0e0c" opacity="0.7"/>
  <polygon points="104,52 68,60 68,64 106,58" fill="#0f0e0c" opacity="0.7"/>
  <!-- Glut hinter den Augen -->
  <ellipse cx="42" cy="67" rx="26" ry="15" fill="url(#glow)"/>
  <ellipse cx="86" cy="67" rx="26" ry="15" fill="url(#glow)"/>
  <!-- Augen -->
  <polygon points="24,58 60,64 56,78 32,74" fill="url(#eye)"/>
  <polygon points="104,58 68,64 72,78 96,74" fill="url(#eye)"/>
  <polygon points="36,64 54,67 53,71 38,69" fill="#fff3ea" opacity="0.55"/>
  <polygon points="92,64 74,67 75,71 90,69" fill="#fff3ea" opacity="0.55"/>
  <!-- Nase und Kinn -->
  <polygon points="55,90 73,90 64,101" fill="#0f0e0c"/>
  <polygon points="50,104 78,104 64,116" fill="#0f0e0c" opacity="0.55"/>
</svg>
