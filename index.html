<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kern und Kraft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Kostenlose Fitness-App für Muskelaufbau und Fettabbau am Bauch. Läuft offline, speichert nur auf deinem Gerät.">
<meta name="theme-color" content="#0f0e0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: Phone-App mit scrollender Ansicht und fester Tab-Leiste. Sribavan-Group-Sprache: warmes Schwarz, Gold als einziger Akzent, Serife für Headlines und Zahlen, gesperrte Versal-Labels, Hairlines statt Schatten. */
:root {
  --bg: #0f0e0c; --surface: #15140f; --surface-2: #1d1b16; --fg: #f1ece2; --fg-muted: #a39d90;
  --line: #2b2822; --accent: #c9a961; --accent-fg: #15120a; --accent-soft: #2a2416;
  --warm: #c98a52; --warm-soft: #33231a; --good: #8fb996; --good-soft: #1d2a20; --bad: #cf6f5f; --bad-soft: #35201c; --cool: #8a9db3;
  --display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --body: "Jost", "Futura", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --radius: 2px; --shadow: none;
  --glow: radial-gradient(60% 40% at 50% 0%, rgba(201,169,97,.10), transparent 70%);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f1e8; --surface: #fbf8f1; --surface-2: #ece6d8; --fg: #1a1815; --fg-muted: #6b655a;
    --line: #d9d1c0; --accent: #9a7b2f; --accent-fg: #fbf8f1; --accent-soft: #efe5c9;
    --warm: #a8622c; --warm-soft: #f3e2d2; --good: #3f7d4e; --good-soft: #dfecdf; --bad: #a8463a; --bad-soft: #f3dcd6; --cool: #5d728a;
    --glow: radial-gradient(60% 40% at 50% 0%, rgba(154,123,47,.10), transparent 70%);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f1e8; --surface: #fbf8f1; --surface-2: #ece6d8; --fg: #1a1815; --fg-muted: #6b655a;
  --line: #d9d1c0; --accent: #9a7b2f; --accent-fg: #fbf8f1; --accent-soft: #efe5c9;
  --warm: #a8622c; --warm-soft: #f3e2d2; --good: #3f7d4e; --good-soft: #dfecdf; --bad: #a8463a; --bad-soft: #f3dcd6; --cool: #5d728a;
  --glow: radial-gradient(60% 40% at 50% 0%, rgba(154,123,47,.10), transparent 70%);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--glow), var(--bg); background-color: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 2.3rem; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.3rem; }
em.gold { font-style: italic; color: var(--accent); font-weight: 500; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; height: 100%; }
.view { flex: 1; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; }
.view > * + * { margin-top: 18px; }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; position: sticky; top: -18px; margin-top: -18px; padding-block: 18px 12px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 5; border-bottom: 1px solid var(--line); }
.topbar h1::before { content: "Kern und Kraft"; display: block; font-family: var(--body); font-size: .66rem; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.topbar .date { color: var(--fg-muted); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; padding-bottom: 6px; text-align: right; }
.eyebrow { font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.muted { color: var(--fg-muted); }
.small { font-size: .88rem; }
.num, .hero-num, .kpi .val, .tile .big, .ring .center, td, th { font-variant-numeric: lining-nums tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card > * + * { margin-top: 10px; }
.stack > * + * { margin-top: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 360px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: transparent; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.tile .big { font-family: var(--display); font-size: 1.9rem; font-weight: 600; line-height: 1; }
.tile .lbl { font-size: .72rem; color: var(--fg-muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: var(--radius); padding: 9px 16px; cursor: pointer; font-weight: 500; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; min-height: 42px; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--surface-2); border-color: var(--fg-muted); }
.btn:active, .tab:active, .check:active { transform: scale(.97); }
.btn:focus-visible, input:focus-visible, select:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: .68rem; letter-spacing: .1em; }
.btn.block { width: 100%; }
label.f { display: block; }
label.f span.l { display: block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 5px; }
input[type="text"], input[type="number"], input[type="date"], select { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 9px 10px; min-height: 42px; }
input:focus { border-color: var(--accent); }
input.set-in { width: 100%; text-align: center; padding: 6px 4px; }
.bar { height: 4px; background: var(--surface-2); border-radius: 0; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 0; transition: width .3s; }
.bar > i.warm { background: var(--warm); }
.bar > i.good { background: var(--good); }
.bar > i.bad { background: var(--bad); }
.pill { display: inline-block; font-size: .64rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--radius); border: 1px solid var(--line); background: transparent; color: var(--fg-muted); }
.pill.good { border-color: var(--good); color: var(--good); }
.pill.warm { border-color: var(--warm); color: var(--warm); }
.pill.bad { border-color: var(--bad); color: var(--bad); }
.pill.accent { border-color: var(--accent); color: var(--accent); }
.tabs { display: flex; border-top: 1px solid var(--line); background: var(--surface); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { flex: 1; border: 0; background: none; padding: 10px 4px 8px; color: var(--fg-muted); font-size: .6rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; border-radius: 0; border-top: 2px solid transparent; margin-top: -1px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.tab.active { color: var(--accent); border-top-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-muted); font-weight: 500; }
td.r, th.r { text-align: right; }
.tablewrap { overflow-x: auto; }
.ex { border-top: 1px solid var(--line); padding-top: 10px; }
.ex:first-of-type { border-top: 0; padding-top: 0; }
.setgrid { display: grid; grid-template-columns: 2.2rem 1fr 1fr 2.2rem; gap: 6px; align-items: center; }
.setgrid .h { font-size: .72rem; color: var(--fg-muted); text-align: center; }
.setgrid .n { text-align: center; color: var(--fg-muted); font-size: .85rem; }
.check { width: 2.2rem; height: 38px; border-radius: var(--radius); border: 1px solid var(--line); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--fg-muted); }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.check svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.hint { font-size: .88rem; padding: 10px 12px; border-radius: var(--radius); background: var(--accent-soft); color: var(--fg); border-left: 2px solid var(--accent); }
.hint.warm { border-left-color: var(--warm); } .hint.good { border-left-color: var(--good); } .hint.bad { border-left-color: var(--bad); }
.hint.warm { background: var(--warm-soft); }
.hint.good { background: var(--good-soft); }
.hint.bad { background: var(--bad-soft); }
canvas { width: 100%; height: 190px; display: block; }
.list { display: flex; flex-direction: column; }
.list > div { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.list > div:last-child { border-bottom: 0; }
.list > div > * { min-width: 0; }
.url { overflow-wrap: anywhere; word-break: break-all; }
.meal { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.meal:last-child { border-bottom: 0; }
.meal button { flex-shrink: 0; }
details summary { cursor: pointer; font-weight: 500; letter-spacing: .04em; }
details[open] summary { margin-bottom: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); padding: 9px 16px; border-radius: var(--radius); font-weight: 500; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: calc(100% - 32px); text-align: center; z-index: 20; }
.toast.show { opacity: 1; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 70px; }
.seg button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.seg.compact { flex-wrap: nowrap; gap: 4px; }
.seg.compact button { flex: 0 0 auto; min-width: 0; padding-inline: 10px; }
.steps { counter-reset: s; }
.hero-num { font-family: var(--display); font-size: 3rem; font-weight: 600; line-height: 1.05; margin-bottom: 4px; }
.cal-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-strip div { text-align: center; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; padding: 7px 0; border-radius: var(--radius); border: 1px solid var(--line); color: var(--fg-muted); }
.cal-strip div.done { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.cal-strip div.today { border-color: var(--accent); }
/* Dashboard */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi .lbl { font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 500; display: flex; justify-content: space-between; gap: 6px; }
.kpi .lbl .pill { white-space: nowrap; flex-shrink: 0; align-self: flex-start; }
.kpi .val { font-family: var(--display); font-size: 2.1rem; font-weight: 600; line-height: 1; }
.kpi .val small { font-family: var(--body); font-size: .8rem; font-weight: 400; color: var(--fg-muted); }
.kpi .sub { font-size: .78rem; color: var(--fg-muted); }
.kpi canvas { height: 34px; width: 100%; }
.rings { display: flex; gap: 14px; justify-content: space-around; flex-wrap: wrap; }
.ring { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 110px; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; stroke-linecap: butt; }
.ring .track { stroke: var(--surface-2); }
.ring .fill { stroke: var(--accent); transition: stroke-dashoffset .5s; }
.ring .fill.warm { stroke: var(--warm); } .ring .fill.good { stroke: var(--good); } .ring .fill.bad { stroke: var(--bad); }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--display); font-weight: 600; font-size: 1.4rem; line-height: 1; }
.ring .center small { font-family: var(--body); font-weight: 400; font-size: .7rem; color: var(--fg-muted); }
.ring .wrap { position: relative; width: 92px; height: 92px; }
.chart-tip { position: absolute; pointer-events: none; background: var(--accent); color: var(--accent-fg); font-size: .78rem; padding: 4px 8px; border-radius: var(--radius); white-space: nowrap; transform: translate(-50%, -130%); display: none; }
.chart-wrap { position: relative; }
.ph-prev { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--radius); display: block; border: 1px solid var(--line); }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px; font-size: .88rem; color: var(--fg-muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (min-width: 720px) { .view { max-width: 680px; margin: 0 auto; width: 100%; } .tabs { justify-content: center; } .tab { max-width: 130px; } }
</style>
</head>
<body>
<div class="app">
  <main class="view" id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="Bereiche">
    <button class="tab" data-tab="heute" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Heute</button>
    <button class="tab" data-tab="training" type="button"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Training</button>
    <button class="tab" data-tab="dashboard" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>Dashboard</button>
    <button class="tab" data-tab="essen" type="button"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>Essen</button>
    <button class="tab" data-tab="mehr" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.2"/><circle cx="5" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Mehr</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===================== Daten und Speicherung ===================== */
const KEY = 'kernkraft.v1';
const defaultState = () => ({ profile: null, plan: null, workouts: [], visits: [], active: null, weights: {}, health: {}, days: {}, nextSession: 0, created: todayISO() });
let S = load();

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); return Object.assign(defaultState(), s); } } catch (e) {}
  return defaultState();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Speichern nicht möglich. Browser-Speicher prüfen.'); } }

function todayISO(d = new Date()) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return todayISO(d); }
function fmtDate(iso, opts) { const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('de-DE', opts || { weekday: 'short', day: '2-digit', month: '2-digit' }); }
function fmt(n, dec = 1) { if (n == null || isNaN(n)) return '–'; return n.toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function num(v) { if (v == null) return NaN; const s = String(v).trim().replace(',', '.'); if (s === '') return NaN; return parseFloat(s); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function weekStart(iso) { const d = new Date(iso + 'T12:00:00'); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return todayISO(d); }
function el(id) { return document.getElementById(id); }
function trainedOn(iso) { return S.workouts.some(w => w.date === iso) || S.visits.some(v => v.date === iso); }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }
function minutesSince(ts) { return Math.max(0, Math.round((Date.now() - ts) / 60000)); }
let toastT; function toast(msg) { const t = el('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ===================== Theme ===================== */
const THEME_KEY = 'kernkraft.theme';
function getTheme() { try { return localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) { return 'dark'; } }
function applyTheme(t) {
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  const r = document.documentElement;
  if (t === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', getComputedStyle(r).getPropertyValue('--bg').trim() || '#0e1413');
}
applyTheme(getTheme());

/* ===================== Health-Import (Apple Health, Oura via Kurzbefehl) ===================== */
function parseNum(v) { if (v == null) return NaN; const m = String(v).replace(/\s/g, '').replace(',', '.').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; }
function importHealth(qs) {
  const q = new URLSearchParams(qs); const got = [];
  let date = (q.get('date') || '').slice(0, 10); if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) date = todayISO();
  const w = parseNum(q.get('w') || q.get('weight')); if (w >= 35 && w <= 300) { S.weights[date] = Math.round(w * 10) / 10; got.push('Gewicht ' + fmt(w) + ' kg'); }
  const h = S.health[date] || {};
  const rhr = parseNum(q.get('rhr') || q.get('hr')); if (rhr >= 30 && rhr <= 150) { h.rhr = Math.round(rhr); got.push('Ruhepuls ' + h.rhr); }
  const hrv = parseNum(q.get('hrv')); if (hrv >= 5 && hrv <= 300) { h.hrv = Math.round(hrv); got.push('HRV ' + h.hrv + ' ms'); }
  let sl = parseNum(q.get('sleep') || q.get('schlaf')); if (!isNaN(sl)) { if (sl > 1440) sl = sl / 3600; else if (sl > 24) sl = sl / 60; if (sl > 0 && sl <= 16) { h.sleep = Math.round(sl * 10) / 10; got.push('Schlaf ' + fmt(h.sleep) + ' h'); } }
  const st = parseNum(q.get('steps') || q.get('schritte')); if (st >= 0 && st < 100000) { if (!S.days[date]) S.days[date] = { items: [], steps: null }; S.days[date].steps = Math.round(st); got.push('Schritte ' + Math.round(st).toLocaleString('de-DE')); }
  if (Object.keys(h).length) S.health[date] = h;
  if (got.length) { save(); toast('Übernommen für ' + fmtDate(date, { day: '2-digit', month: '2-digit' }) + ': ' + got.join(', ')); } else toast('Keine verwertbaren Werte im Link.');
  return got.length;
}
function healthSeries(key, days) {
  const out = []; const today = todayISO();
  for (let i = days - 1; i >= 0; i--) { const d = addDays(today, -i); const v = key === 'steps' ? (S.days[d] && S.days[d].steps) : (S.health[d] && S.health[d][key]); out.push({ d, v: v == null ? null : v }); }
  return out;
}
function latestHealth(key) { const dates = Object.keys(key === 'steps' ? S.days : S.health).filter(d => key === 'steps' ? S.days[d].steps != null : S.health[d][key] != null).sort(); if (!dates.length) return null; const d = dates[dates.length - 1]; return { d, v: key === 'steps' ? S.days[d].steps : S.health[d][key] }; }
function avgOf(series) { const v = series.map(x => x.v).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }

/* ===================== Ziele berechnen ===================== */
function targets(p) {
  if (!p) return null;
  const w = p.weight, h = p.height, a = p.age;
  const bmr = p.sex === 'w' ? 10 * w + 6.25 * h - 5 * a - 161 : 10 * w + 6.25 * h - 5 * a + 5;
  const act = { 1: 1.2, 2: 1.375, 3: 1.55, 4: 1.725 }[p.activity] || 1.375;
  const tdee = bmr * act + (p.days * 45 * 5) / 7; // Krafttraining grob 5 kcal/min, auf die Woche verteilt
  const deficit = p.pace === 'slow' ? 300 : p.pace === 'fast' ? 500 : 400;
  const floor = Math.max(p.sex === 'w' ? 1400 : 1600, Math.round(bmr * 1.05));
  const kcal = Math.max(floor, Math.round((tdee - deficit) / 10) * 10 + (p.kcalAdjust || 0));
  const goalW = p.goal || w;
  const protein = Math.round(goalW * 1.8);
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, protein, proteinMin: Math.round(goalW * 1.6), proteinMax: Math.round(goalW * 2.2), deficit: Math.round(tdee - kcal), floorHit: kcal === floor };
}

/* Letzte Leistung je Übung und Vorschlag für heute */
function lastPerf(exId) {
  for (let i = S.workouts.length - 1; i >= 0; i--) {
    const e = S.workouts[i].ex.find(x => x.id === exId);
    if (e && e.sets.some(s => s.done)) return { date: S.workouts[i].date, sets: e.sets.filter(s => s.done) };
  }
  return null;
}
function suggestion(ex) {
  const last = lastPerf(ex.id);
  if (!last) return { text: 'Erstes Mal: Gewicht wählen, mit dem die letzte Wiederholung sauber, aber anstrengend ist.', w: null, r: ex.reps[0] };
  const top = ex.reps[1];
  const allTop = last.sets.length >= ex.sets && last.sets.every(s => (s.r || 0) >= top);
  const w = Math.max(...last.sets.map(s => s.w || 0));
  const minR = Math.min(...last.sets.map(s => s.r || 0));
  const dateTxt = fmtDate(last.date, { day: '2-digit', month: '2-digit' });
  if (ex.unit === 'kg') {
    if (allTop) return { text: `Letztes Mal (${dateTxt}): ${last.sets.length}×${top} mit ${fmt(w, 1)} kg. Alle Sätze am oberen Ende, heute ${fmt(w + ex.inc, 1)} kg.`, w: w + ex.inc, r: ex.reps[0], up: true };
    return { text: `Letztes Mal (${dateTxt}): ${fmt(w, 1)} kg, schwächster Satz ${minR}. Gewicht halten und Wiederholungen steigern.`, w, r: Math.min(top, minR + 1) };
  }
  if (ex.unit === 's') {
    if (allTop) return { text: `Letztes Mal (${dateTxt}): ${minR} s gehalten. Heute ${minR + ex.inc} s oder schwerere Variante.`, w: null, r: Math.min(top + 30, minR + ex.inc), up: true };
    return { text: `Letztes Mal (${dateTxt}): kürzester Satz ${minR} s. Heute ${Math.min(top, minR + ex.inc)} s anpeilen.`, w: null, r: Math.min(top, minR + ex.inc) };
  }
  if (allTop) return { text: `Letztes Mal (${dateTxt}): alle Sätze mit ${top}. Heute schwerere Variante oder Zusatzgewicht (Rucksack).`, w: w || null, r: top, up: true };
  return { text: `Letztes Mal (${dateTxt}): schwächster Satz ${minR}. Heute eine Wiederholung mehr.`, w: w || null, r: Math.min(top, minR + 1) };
}

/* ===================== Routing ===================== */
const TABS = ['heute', 'training', 'dashboard', 'essen', 'mehr'];
let current = 'heute';
let session = null; // laufende Trainingseinheit
function nav(tab) {
  current = TABS.includes(tab) ? tab : 'heute';
  try { if (location.hash !== '#' + current) history.replaceState(null, '', '#' + current); } catch (e) {}
  render();
}
function handleActionHash() {
  let h = location.hash.slice(1);
  try { h = decodeURIComponent(h); } catch (e) {}
  if (h.startsWith('health')) {
    const qs = h.includes('?') ? h.slice(h.indexOf('?') + 1) : (location.search || '').slice(1);
    if (S.profile) importHealth(qs); else toast('Erst das Erstgespräch abschließen, dann Health-Daten senden.');
    current = 'dashboard'; try { history.replaceState(null, '', '#dashboard'); } catch (e) {} render(); return true;
  }
  if (h.startsWith('meal')) {
    if (S.profile) addMealFromLink(h.includes('?') ? h.slice(h.indexOf('?') + 1) : '');
    current = 'essen'; try { history.replaceState(null, '', '#essen'); } catch (e) {} render(); return true;
  }
  if (h === 'gewicht') { current = 'dashboard'; try { history.replaceState(null, '', '#dashboard'); } catch (e) {} render(); return true; }
  if (h === 'checkin' || h === 'checkout') {
    if (S.profile) { if (h === 'checkin') checkIn(); else if (S.active) { checkoutPanel = true; } else toast('Kein Check-in aktiv.'); }
    current = 'heute'; try { history.replaceState(null, '', '#heute'); } catch (e) {} render(); return true;
  }
  return false;
}
window.addEventListener('hashchange', () => { if (handleActionHash()) return; const h = location.hash.slice(1); if (TABS.includes(h) && h !== current) { current = h; render(); } });
el('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) nav(b.dataset.tab); });

function render() {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === current));
  const v = el('view');
  if (!S.profile) { v.innerHTML = onboardingHTML(); bindOnboarding(); return; }
  if (current === 'training' && session) { v.innerHTML = sessionHTML(); bindSession(); return; }
  v.innerHTML = ({ heute: heuteHTML, training: trainingHTML, dashboard: dashboardHTML, essen: essenHTML, mehr: mehrHTML })[current]();
  ({ heute: bindHeute, training: bindTraining, dashboard: bindDashboard, essen: bindEssen, mehr: bindMehr })[current]();
  v.scrollTop = 0;
}

  const thisW = avg(addDays(today, -6), today), lastW = avg(addDays(today, -13), addDays(today, -7)), prevW = avg(addDays(today, -20), addDays(today, -14));
  return { latest: S.weights[dates[dates.length - 1]], latestDate: dates[dates.length - 1], thisW, lastW, prevW, first: S.weights[dates[0]], firstDate: dates[0], count: dates.length };
}

(function initSample() {

})();
async function shrinkImage(file) {
  try {
    const bmp = await createImageBitmap(file);
    const max = 1400, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.85));
  } catch (e) { return file; }
}
function photoPrompt() {

{"name": "kurzer Name der Mahlzeit", "items": [{"n": "Bestandteil", "g": 150, "kcal": 200, "p": 12}], "kcal": 650, "p": 35, "note": "ein Satz zur größten Unsicherheit oder zum einfachsten Proteinhebel"}`;

async function analyzePhoto() {

  try {
    const r = await sampleFn.json(photoPrompt(), { images: [photo.blob], modelTier: 'default', signal: photo.ctl.signal });
    if (!r || typeof r !== 'object') throw { code: 'invalid_json' };
    const items = Array.isArray(r.items) ? r.items.map(it => ({ n: String(it.n || '').slice(0, 60), g: Math.round(parseNum(it.g) || 0), kcal: Math.round(parseNum(it.kcal) || 0), p: Math.round(parseNum(it.p) || 0) })) : [];
    let kcal = Math.round(parseNum(r.kcal)), prot = Math.round(parseNum(r.p));
    if (!(kcal > 0) && items.length) kcal = items.reduce((a, i) => a + i.kcal, 0);
    if (!(prot >= 0) && items.length) prot = items.reduce((a, i) => a + i.p, 0);
    if (!(kcal > 0)) throw { code: 'invalid_json' };
    photo.result = { name: String(r.name || 'Mahlzeit').slice(0, 60), items, kcal, p: prot >= 0 ? prot : 0, note: String(r.note || '').slice(0, 200) };
  } catch (e) {
    const c = e && e.code;
    photo.err = c === 'cancelled' ? '' : c === 'not_granted' ? 'Du hast der App den Zugriff auf Claude nicht erlaubt. Über das Menü der Seite lässt sich das ändern.' : c === 'rate_limited' ? 'Gerade zu viele Anfragen oder Nutzungslimit erreicht. Später noch einmal versuchen.' : c === 'image_rejected' ? 'Das Bild wurde nicht angenommen. Bitte ein anderes Foto (JPEG oder PNG) wählen.' : c === 'invalid_json' ? 'Die Antwort war nicht lesbar. Noch einmal versuchen oder die Werte von Hand eintragen.' : c === 'refused' ? 'Claude hat dieses Bild nicht bewertet. Bitte ein anderes Foto versuchen.' : 'Die Schätzung ist fehlgeschlagen. Noch einmal versuchen oder von Hand eintragen.';

}

function bindPhoto() {
  const f = el('ph-file'); if (!f) return;
  const f2 = el('ph-file2');
  el('ph-pick').addEventListener('click', () => f.click());
  const p2 = el('ph-pick2'); if (p2) p2.addEventListener('click', () => f2.click());
  const onFile = async inp => {
    const file = inp.files && inp.files[0]; if (!file) return;
    if (photo.url) { try { URL.revokeObjectURL(photo.url); } catch (e) {} }
    photo = { blob: null, url: null, result: null, busy: false, ctl: null, err: '' };
    photo.blob = await shrinkImage(file); photo.url = URL.createObjectURL(photo.blob); render();
    if (sampleFn && sampleImages) analyzePhoto();
  };
  f.addEventListener('change', () => onFile(f)); f2.addEventListener('change', () => onFile(f2));
  const go = el('ph-go'); if (go) go.addEventListener('click', analyzePhoto);
  const st = el('ph-stop'); if (st) st.addEventListener('click', () => { if (photo.ctl) photo.ctl.abort(); });
  const add = el('ph-add'); if (add) add.addEventListener('click', () => {
    const k = num(el('ph-k').value), pr = num(el('ph-p').value); if (!(k > 0)) { toast('Bitte Kalorien prüfen.'); return; }

}
function addMealFromLink(qs) {

      <li>Nachhaltig schlägt schnell: 300 bis 500 kcal Defizit, grob 0,3 bis 0,5 kg pro Woche.</li>
      <li>Protein und Krafttraining sind das Fundament. 1,6 bis 2,2 g Protein pro kg Zielgewicht, 2 bis 4 Krafteinheiten.</li>
      <li>Der beste Plan ist der, der in die Woche passt.</li>
      <li>Messen statt raten: Wochenschnitt, Training ja oder nein, alle 2 bis 3 Wochen anpassen.</li>
      <li>Keine Wundermittel, keine Verbotslisten, kein Training durch Schmerz.</li>
      <li>Rückschläge sind Daten, kein Drama.</li>
    </ul>
    <p class="small muted">Kein Ersatz für ärztlichen Rat. Bei Beschwerden, Medikamenten oder Vorerkrankungen vorher abklären lassen.</p>
  </section>
  <p class="small muted">Kern und Kraft · kostenlos, offline, ohne Konto. Zum Installieren im Browser-Menü „Zum Startbildschirm hinzufügen“ wählen.</p>`;
}
function appUrl(action) { try { return location.href.split('#')[0] + '#' + action; } catch (e) { return '#' + action; } }
function copyText(txt, okMsg) { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(okMsg)).catch(() => fallbackCopy(txt)); else fallbackCopy(txt); }
function bindMehr() {
  if (editProfile) { bindOnboarding(); return; }
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copyText(el(b.dataset.copy).textContent, 'Link kopiert.')));
  document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => { applyTheme(b.dataset.themeSet); render(); }));
  el('m-edit').addEventListener('click', () => { editProfile = true; render(); });
  el('m-export').addEventListener('click', () => {
    try { const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kern-und-kraft-' + todayISO() + '.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Sicherung erstellt. Falls nichts passiert: Zwischenablage nutzen.'); } catch (e) { toast('Download nicht möglich, bitte Zwischenablage nutzen.'); }
  });
  el('m-copy').addEventListener('click', () => {
    const txt = JSON.stringify(S);
    copyText(txt, 'Sicherung kopiert. In eine Notiz einfügen.');
  });
  el('m-import').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || typeof d !== 'object' || !('weights' in d)) throw 0; S = Object.assign(defaultState(), d); S.visits = S.visits || []; S.health = S.health || {}; if (S.profile && !S.plan) S.plan = buildPlan(S.profile); save(); toast('Sicherung wiederhergestellt.'); render(); } catch (err) { toast('Datei nicht lesbar. Ist es eine Sicherung dieser App?'); } };
    r.readAsText(f);
  });
  el('m-reset').addEventListener('click', () => { const b = el('m-reset'); if (b.dataset.c) { S = defaultState(); save(); session = null; editProfile = false; toast('Alles gelöscht.'); nav('heute'); } else { b.dataset.c = '1'; b.textContent = 'Wirklich alles löschen?'; } });
}
function fallbackCopy(txt) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); toast(ok ? 'Sicherung kopiert.' : 'Kopieren nicht möglich. Download nutzen.'); }

/* ===================== Start ===================== */
(function start() {
  if (S.profile && !S.plan) { S.plan = buildPlan(S.profile); save(); }
  if (!handleActionHash()) { const h = location.hash.slice(1); if (TABS.includes(h)) current = h; render(); }
  try { if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  window.addEventListener('resize', () => { if (current === 'dashboard' && !session) { drawChart(); drawSparks(); } });
  const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', () => { applyTheme(getTheme()); if (current === 'dashboard') { drawChart(); drawSparks(); } });
})();
</script>
